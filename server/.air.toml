root = "."
tmp_dir = "tmp"

[build]
  # -buildvcs=false evita el error "error obtaining VCS status: exit status 128"
  # cuando el proyecto no está dentro de un repositorio Git.
  cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "bin", "vendor", "db", ".git", "docs", ".cache", "downloads"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
  send_interrupt = true

[screen]
  clear_on_rebuild = false
