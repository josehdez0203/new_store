name: credit_store_app
description: "Cliente Flutter para el sistema de ventas a crédito."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  carousel_slider: ^5.1.2
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
